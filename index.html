<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск секретного подарка</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #fff1a8, transparent 32%),
                  radial-gradient(circle at bottom right, #bfdbfe, transparent 34%),
                  linear-gradient(145deg, #fff7ed, #fce7f3, #dbeafe);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      color: #202020;
    }

    .app {
      width: 100%;
      max-width: 470px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 30px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.9);
    }

    .top {
      padding: 20px 18px 14px;
      background: linear-gradient(135deg, #38bdf8, #f472b6, #facc15);
      text-align: center;
    }

    .top h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.1;
      color: #1f2937;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.45);
    }

    .subtitle {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #374151;
    }

    .progress {
      margin-top: 14px;
      height: 13px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .card {
      padding: 22px;
      text-align: center;
    }

    .picture {
      min-height: 180px;
      border-radius: 28px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #eff6ff, #fff7ed);
      border: 3px dashed #f59e0b;
      position: relative;
      overflow: hidden;
    }

    .picture::before,
    .picture::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      opacity: 0.25;
    }

    .picture::before {
      background: #fb7185;
      left: -30px;
      top: -30px;
    }

    .picture::after {
      background: #38bdf8;
      right: -30px;
      bottom: -30px;
    }

    .emoji {
      font-size: 78px;
      z-index: 1;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.14));
    }

    .badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 25px;
      color: #111827;
    }

    .task {
      font-size: 19px;
      line-height: 1.45;
      margin: 0 auto 18px;
    }

    .hint {
      display: none;
      margin: 16px 0 0;
      padding: 14px;
      background: #ecfdf5;
      border: 2px solid #86efac;
      border-radius: 18px;
      font-size: 17px;
      line-height: 1.35;
      text-align: left;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.14);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.14);
    }

    .primary {
      background: #22c55e;
      color: white;
    }

    .secondary {
      background: #e0f2fe;
      color: #075985;
    }

    .small-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .note {
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <h1>Поиск секретного подарка</h1>
      <div class="subtitle">Домашний квест для именинника</div>
      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="card">
      <div class="picture">
        <div class="emoji" id="emoji">🎁</div>
      </div>

      <div class="badge" id="badge">Старт</div>
      <h2 id="title">Подарок спрятан!</h2>
      <div class="task" id="task"></div>
      <div class="hint" id="hint"></div>

      <div class="buttons">
        <button class="secondary" id="hintButton" onclick="showHint()">Подсказка для взрослого</button>
        <div class="small-row">
          <button class="secondary" onclick="prevStep()">Назад</button>
          <button class="primary" onclick="nextStep()" id="nextButton">Начать</button>
        </div>
      </div>

      <div class="note">Лучше, если взрослый читает задания вслух и нажимает кнопки вместе с ребёнком.</div>
    </section>
  </main>

  <script>
    const steps = [
      {
        badge: "Старт",
        emoji: "🎁✨",
        title: "Подарок спрятан!",
        task: "Привет, Стас! Сегодня тебя ждёт секретная миссия. Нужно пройти 5 заданий, найти подсказки и добраться до подарка.",
        hint: "Перед стартом спрячь подарок у дивана, телевизора или в другом финальном месте."
      },
      {
        badge: "Шаг 1 из 5",
        emoji: "❄️🍓",
        title: "Холодная загадка",
        task: "Найди место, где всегда прохладно, а внутри живут вкусняшки и не портятся.",
        hint: "Ответ: холодильник. В холодильник можно положить маленькую бумажку: «Отлично! Первую подсказку нашёл!»"
      },
      {
        badge: "Шаг 2 из 5",
        emoji: "🦸‍♂️⚡",
        title: "Испытание супергероя",
        task: "Чтобы идти дальше, выполни супергеройскую разминку: 5 прыжков, 3 приседания и один круг по комнате.",
        hint: "После выполнения скажи: «Теперь ищи там, где живут твои ботинки». Ответ: прихожая или обувная полка."
      },
      {
        badge: "Шаг 3 из 5",
        emoji: "🔴🧸⚽",
        title: "Охота за предметами",
        task: "Найди и принеси 3 вещи: что-то красное, что-то мягкое и что-то круглое.",
        hint: "Когда ребёнок принесёт вещи, скажи: «Следующая подсказка спряталась там, где люди становятся чистыми». Ответ: ванная."
      },
      {
        badge: "Шаг 4 из 5",
        emoji: "🔐⭐🚗🐻",
        title: "Тайный код",
        task: "Разгадай секретный код: 🐻 = 1, 🚗 = 2, ⭐ = 3. Что получится: ⭐ 🚗 🐻 ?",
        hint: "Ответ: 3-2-1. После правильного ответа отправь ребёнка туда, где ночью появляются сны. Ответ: кровать или подушка."
      },
      {
        badge: "Шаг 5 из 5",
        emoji: "🌟🔎🌟",
        title: "Три волшебные звезды",
        task: "Найди в комнате 3 спрятанные звёздочки, наклейки или бумажки. Когда найдёшь все, миссия почти завершена!",
        hint: "Заранее спрячь 3 маленькие бумажные звезды в детской. После находки скажи: Ты справился со всеми испытаниями! Подарок ждёт тебя там, где ты смотришь мультики!"
      },
      {
        badge: "Финиш",
        emoji: "🎉🎁🎉",
        title: "Секретный подарок найден!",
        task: "Ты справился со всеми заданиями! С ДНЕМ РОЖДЕНИЯ!.",
        hint: "Вручаем заветный подарок."
      }
    ];

    let currentStep = 0;

    function renderStep() {
      const step = steps[currentStep];
      document.getElementById("emoji").textContent = step.emoji;
      document.getElementById("badge").textContent = step.badge;
      document.getElementById("title").textContent = step.title;
      document.getElementById("task").textContent = step.task;
      document.getElementById("hint").textContent = step.hint;
      document.getElementById("hint").style.display = "none";

      const progress = Math.round((currentStep / (steps.length - 1)) * 100);
      document.getElementById("progressFill").style.width = progress + "%";

      const nextButton = document.getElementById("nextButton");
      if (currentStep === 0) {
        nextButton.textContent = "Начать";
      } else if (currentStep === steps.length - 1) {
        nextButton.textContent = "Сначала";
      } else {
        nextButton.textContent = "Выполнено! Дальше";
      }
    }

    function showHint() {
      const hint = document.getElementById("hint");
      hint.style.display = hint.style.display === "block" ? "none" : "block";
    }

    function nextStep() {
      if (currentStep === steps.length - 1) {
        currentStep = 0;
      } else {
        currentStep++;
      }
      renderStep();
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    renderStep();
  </script>
</body>
</html>
